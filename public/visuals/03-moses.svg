<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="03-moses-title 03-moses-desc" font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><title id="03-moses-title">표징의 재료와 재앙의 재료</title><desc id="03-moses-desc">4장 · 지팡이·손·물이 표징의 재료. 9장 · 화덕의 재를 날려 종기가 생김</desc><rect x="0" y="0" width="800" height="560" rx="22" fill="#fcfaf1" stroke="none" stroke-width="2"/><text x="28" y="49" fill="#244744" font-size="30" font-weight="700" text-anchor="start">표징의 재료와 재앙의 재료</text><text x="771" y="46" fill="#708073" font-size="14" font-weight="500" text-anchor="end">말씀 그림 노트</text><g data-visual-part="0"><rect x="24" y="86" width="485" height="400" rx="18" fill="#e2e8d8" stroke="none" stroke-width="2"/><rect x="42" y="102" width="94" height="33" rx="16" fill="#244744" stroke="none" stroke-width="2"/><text x="89" y="126" fill="#fffaf0" font-size="19" font-weight="600" text-anchor="middle">4장</text><text x="267" y="172" fill="#244744" font-size="27" font-weight="600" text-anchor="middle">모세에게 주신 표징</text><g transform="translate(120 275) scale(1)"><path d="M-25 58 V-52 Q-25 -79 -3 -70" fill="none" stroke="#b96c48" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M18 53 C70 15 1 20 45 -27 Q68 -46 41 -57" fill="none" stroke="#6e8963" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(270 275) scale(1)"><path d="M-31 42 L-45 4 Q-47 -14 -31 -8 L-20 7 V-43 Q-15 -60 -7 -43 V-3 V-58 Q2 -70 10 -55 V-4 V-47 Q20 -59 27 -44 V2 V-26 Q37 -38 44 -23 V32 Q38 67 -7 65Z" fill="#d2a859" stroke="#244744" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(423 275) scale(1)"><path d="M0 -58 C-18 -30 -45 -4 -39 21 C-30 65 32 65 40 21 C44 -3 19 -30 0 -58Z" fill="#bcd4d9" stroke="#244744" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-36 20 Q0 0 38 20 Q29 57 0 55 Q-30 57 -36 20Z" fill="#b96c48" stroke="none" stroke-width="4"