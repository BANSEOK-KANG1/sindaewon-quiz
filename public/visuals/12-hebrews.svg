<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="12-hebrews-title 12-hebrews-desc" font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><title id="12-hebrews-title">히브리서 11장의 이름 펼쳐 보기</title><desc id="12-hebrews-desc">22절 · 요셉이 출애굽과 자신의 뼈에 관해 부탁함. 32절 · 기드온·바락·삼손·입다·다윗·사무엘과 선지자들. 이름 구분 · 바락은 직접 나오고 드보라는 직접 나오지 않음</desc><rect x="0" y="0" width="800" height="560" rx="22" fill="#fcfaf1" stroke="none" stroke-width="2"/><text x="28" y="49" fill="#244744" font-size="30" font-weight="700" text-anchor="start">히브리서 11장의 이름 펼쳐 보기</text><text x="771" y="46" fill="#708073" font-size="14" font-weight="500" text-anchor="end">말씀 그림 노트</text><g data-visual-part="0"><rect x="24" y="86" width="230" height="400" rx="18" fill="#e1e8d7" stroke="none" stroke-width="2"/><rect x="41" y="103" width="94" height="33" rx="16" fill="#244744" stroke="none" stroke-width="2"/><text x="88" y="127" fill="#fffaf0" font-size="19" font-weight="600" text-anchor="middle">22절</text><g transform="translate(138 248) scale(0.9)"><path d="M-57 -35 H47 Q63 -35 63 -19 V35 H-46 Q-62 35 -62 18 V-35Z" fill="#f5e6bb" stroke="#244744" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-57 -35 Q-39 -35 -39 -18 V22 Q-39 35 -53 35 M-39 -18 H63" fill="none" stroke="#244744" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-23 -3 H42 M-23 10 H32 M-23 23 H42" fill="none" stroke="#6e8963" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="139" y="356" fill="#244744" font-size="32" font-weight="600" text-anchor="middle">요셉</text><text x="139" y="401" fill="#6e8963" font-size="23" font-weight="600" text-anchor="middle">출애굽 · 뼈</text></g><g data-visual-part="1"><rect x="272" y="86" width="504" height="307" rx="18" fill="#efe4ce" stroke="none" stroke-width="2"/><rect x="291" y="103" width="94" height="33" rx="16" fill="#244744" stroke="none" stroke-width="2"/><text x="338" y="127" fill="#fffaf0" font-size="19" font-weight="600" text-anchor="middle">32절</text><g transform="translate(363 211) scale(1)"><circle cx="0" cy="-8" r="33" fill="#e2d3b0" stroke="none" stroke-width="3"/><text x="0" y="1" fill="#244744" font-size="24" font-weight="600" text-anchor="middle">기드온</text><text x="0" y="38" fill="#708073" font-size="15" font-weight="600" text-anchor="middle">01</text></g><g transform="translate(511 211) scale(1)"><circle cx="0" cy="-8" r="33" fill="#d2a859" stroke="none" stroke-width="3"/><text x="0" y="1" fill="#244744" font-size="24" font-weight="600" text-anchor="middle">바락</text><text x="0" y="38" fill="#708073" font-size="15" font-weight="600" text-anchor="middle">02</text></g><g transform="translate(659 211) scale(1)"><circle cx="0" cy="-8" r="33" fill="#e2d3b0" stroke="none" stroke-width="3"/><text x="0" y="1" fill="#244744" font-size="24" font-weight="600" text-anchor="middle">삼손</text><text x="0" y="38" fill="#708073" font-size="15" font-weight="600" text-anchor="middle">03</text></g><g transform="translate(363 316) scale(1)"><circle cx="0" cy="-8" r="33" fill="#e2d3b0" stroke="none" stroke-width="3"/><text x="0" y="1" fill="#244744" font-size="24" font-weight="600" text-anchor="middle">입다</text><text x="0" y="38" fill="#708073" font-size="15" font-weight="600" text-anchor="middle">04</text></g><g transform="translate(511 316) scale(1)"><circle cx="0" cy="-8" r="33" fill="#e2d3b0" stroke="none" stroke-width="3"/><text x="0" y="1" fill="#244744" font-size="24" font-weight="600" text-anchor="middle">다윗</text><text x="0" y="38" fill="#708073" font-size="15" font-weight="600" text-anchor="middle">05</text></g><g transform="translate(659 316) scale(1)"><circle cx="0" cy="-8" r="33" fill="#e2d3b0" stroke="none" stroke-width="3"/><text x="0" y="1" fill="#244744" font-size="24" font-weight="600" text-anchor="middle">사무엘</text><text x="0" y="38" fill="#708073" font-size="15" font-weight="600" text-anchor="middle">06</text></g><text x="525" y="378" fill="#708073" font-size="22" font-weight="600" text-anchor="middle">그리고 선지자들</text></g><g data-visual-part="2"><rect x="272" y="409" width="504" height="77" rx="18" fill="#dce8e6" stroke="none" stroke-width="2"/><text x="524" y="444" fill="#244744" font-size="24" font-weight="600" text-anchor="middle">바락 ○    드보라 이름은 없음</text><text x="524" y="472" fill="#708073" font-size="17" font-weight="600" text-anchor="middle">본문에 적힌 이름을 구분해요</text></g><text x="400" y="540" fill="#708073" font-size="17" font-weight="500" text-anchor="middle">32절의 열거 순서 · 인물의 연대순이 아니에요</text></svg>
