<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="10-timothy-title 10-timothy-desc" font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><title id="10-timothy-title">디모데에서 여섯 편지로</title><desc id="10-timothy-desc">빌립보서·골로새서 · 바울과 디모데. 데살로니가전후서 · 바울·실루아노·디모데. 고린도후서·빌레몬서 · 바울과 디모데</desc><rect x="0" y="0" width="800" height="560" rx="22" fill="#fcfaf1" stroke="none" stroke-width="2"/><text x="28" y="49" fill="#244744" font-size="30" font-weight="700" text-anchor="start">디모데에서 여섯 편지로</text><text x="771" y="46" fill="#708073" font-size="14" font-weight="500" text-anchor="end">말씀 그림 노트</text><g transform="translate(350 157) scale(0.75)"><circle cx="0" cy="-35" r="12" fill="#d2a859" stroke="none" stroke-width="3"/><path d="M-21 20 Q-18 -17 0 -18 Q18 -17 21 20Z" fill="#6e8963" stroke="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-13 22 L-18 47 M13 22 L18 47" fill="none" stroke="#244744" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(450 157) scale(0.75)"><circle cx="0" cy="-35" r="12" fill="#d2a859" stroke="none" stroke-width="3"/><path d="M-21 20 Q-18 -17 0 -18 Q18 -17 21 20Z" fill="#b96c48" stroke="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-13 22 L-18 47 M13 22 L18 47" fill="none" stroke="#244744" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="400" y="228" fill="#244744" font-size="29" font-weight="600" text-anchor="middle">바울 · 디모데</text><path d="M400 246 V277 M142 277 H658 M142 277 V319 M400 277 V319 M658 277 V319" fill="none" stroke="#6e8963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g data-visual-part="0"><g transform="translate(142 372) scale(1.1)"><rect x="-62" y="-37" width="124" height="76" rx="5" fill="#fffdf5" stroke="#6e8963" stroke-width="2"/><path d="M-60 -33 L0 10 L60 -33 M-60 36 L-20 0 M60 36 L20 0" fill="none" stroke="#6e8963" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="142" y="446" fill="#244744" font-size="22" font-weight="600" text-anchor="middle">빌립보서 · 골로새서</text><text x="142" y="481" fill="#708073" font-size="18" font-weight="600" text-anchor="middle">각 편지의 첫머리</text></g><g data-visual-part="1"><g transform="translate(400 372) scale(1.1)"><rect x="-62" y="-37" width="124" height="76" rx="5" fill="#fffdf5" stroke="#6e8963" stroke-width="2"/><path d="M-60 -33 L0 10 L60 -33 M-60 36 L-20 0 M60 36 L20 0" fill="none" stroke="#6e8963" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="400" y="446" fill="#244744" font-size="22" font-weight="600" text-anchor="middle">데살로니가전후서</text><text x="400" y="481" fill="#708073" font-size="18" font-weight="600" text-anchor="middle">실루아노도 함께</text></g><g data-visual-part="2"><g transform="translate(658 372) scale(1.1)"><rect x="-62" y="-37" width="124" height="76" rx="5" fill="#fffdf5" stroke="#6e8963" stroke-width="2"/><path d="M-60 -33 L0 10 L60 -33 M-60 36 L-20 0 M60 36 L20 0" fill="none" stroke="#6e8963" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="658" y="446" fill="#244744" font-size="22" font-weight="600" text-anchor="middle">고린도후서 · 빌레몬서</text><text x="658" y="481" fill="#708073" font-size="18" font-weight="600" text-anchor="middle">각 편지의 첫머리</text></g><text x="400" y="540" fill="#708073" font-size="17" font-weight="500" text-anchor="middle">빌·골 / 살전·살후 / 고후·몬 = 여섯 편지</text></svg>
