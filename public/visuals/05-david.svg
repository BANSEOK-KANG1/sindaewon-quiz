<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="05-david-title 05-david-desc" font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><title id="05-david-title">나단이 전한 하나의 왕조 약속</title><desc id="05-david-desc">사무엘하 7장 · 나단이 다윗에게 전함. 역대상 17장 · 같은 약속의 병행 기록</desc><rect x="0" y="0" width="800" height="560" rx="22" fill="#fcfaf1" stroke="none" stroke-width="2"/><text x="28" y="49" fill="#244744" font-size="30" font-weight="700" text-anchor="start">나단이 전한 하나의 왕조 약속</text><text x="771" y="46" fill="#708073" font-size="14" font-weight="500" text-anchor="end">말씀 그림 노트</text><rect x="275" y="84" width="250" height="54" rx="18" fill="#e6dfc7" stroke="none" stroke-width="2"/><text x="400" y="120" fill="#244744" font-size="26" font-weight="600" text-anchor="middle">하나님의 약속</text><path d="M400 141 V172" fill="none" stroke="#6e8963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(205 245) scale(1)"><circle cx="0" cy="-35" r="12" fill="#d2a859" stroke="none" stroke-width="3"/><path d="M-21 20 Q-18 -17 0 -18 Q18 -17 21 20Z" fill="#6e8963" stroke="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-13 22 L-18 47 M13 22 L18 47" fill="none" stroke="#244744" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="205" y="320" fill="#244744" font-size="27" font-weight="600" text-anchor="middle">나단</text><g transform="translate(595 238) scale(1.1)"><path d="M-49 -15 L-42 29 H42 L49 -15 L22 2 L0 -28 L-22 2Z" fill="#d2a859" stroke="#244744" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-41 17 H41" fill="none" stroke="#244744" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="595" y="320" fill="#244744" font-size="27" font-weight="600" text-anchor="middle">다윗과 후손</text><path d="M275 238 L515 238" fill="none" stroke="#6e8963" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /