<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="09-paul-title 09-paul-desc" font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><title id="09-paul-title">바울의 여행과 세 도시</title><desc id="09-paul-desc">1차 · 루스드라 · 바나바를 제우스, 바울을 헤르메스라 부름. 2차 · 고린도 · 아굴라·브리스길라를 만나 함께 일함. 3차 · 드로아 · 유두고가 떨어졌다가 살아남</desc><rect x="0" y="0" width="800" height="560" rx="22" fill="#fcfaf1" stroke="none" stroke-width="2"/><text x="28" y="49" fill="#244744" font-size="30" font-weight="700" text-anchor="start">바울의 여행과 세 도시</text><text x="771" y="46" fill="#708073" font-size="14" font-weight="500" text-anchor="end">말씀 그림 노트</text><rect x="24" y="83" width="752" height="407" rx="18" fill="#d9e8e9" stroke="none" stroke-width="2"/><path d="M25 85 H353 L336 126 L302 136 L315 172 L270 195 L285 235 L261 250 L248 290 L210 302 L238 332 L225 349 L190 321 L164 343 L144 311 L102 328 L71 299 L25 294Z" fill="#e2e5c9" stroke="#acbda6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M414 85 H776 V399 L717 387 L650 401 L594 382 L528 390 L492 352 L464 341 L471 310 L449 297 L462 270 L440 254 L449 224 L427 200 L421 169 L399 148Z" fill="#e2e5c9" stroke="#acbda6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M145 340 L195 338 L215 373 L193 414 L160 396 L140 419 L109 386Z" fill="#e2e5c9" stroke="#acbda6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M277 440 Q321 421 373 440 L353 451 L296 452Z" fill="#e2e5c9" stroke="#acbda6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="143" y="144" fill="#708073" font-size="22" font-weight="600" text-anchor="middle">그리스</text><text x="629" y="145" fill="#708073" font-size="25" font-weight="600" text-anchor="middle">소아시아</text><text x="336" y="346" fill="#7c9d9f" font-size="24" font-weight="600" text-anchor="middle">에게해</text><text x="735" y="118" fill="#708073" font-size="18" font-weight="600" text-anchor="middle">북 ↑</