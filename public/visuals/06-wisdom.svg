<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="06-wisdom-title 06-wisdom-desc" font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif"><title id="06-wisdom-title">지혜를 기억하는 두 가지 그림</title><desc id="06-wisdom-desc">욥 28:28 · 경외와 악을 떠남. 잠 1:7·9:10 · 지식과 지혜의 근본</desc><rect x="0" y="0" width="800" height="560" rx="22" fill="#fcfaf1" stroke="none" stroke-width="2"/><text x="28" y="49" fill="#244744" font-size="30" font-weight="700" text-anchor="start">지혜를 기억하는 두 가지 그림</text><text x="771" y="46" fill="#708073" font-size="14" font-weight="500" text-anchor="end">말씀 그림 노트</text><g data-visual-part="0"><rect x="24" y="86" width="368" height="400" rx="18" fill="#e2e8dc" stroke="none" stroke-width="2"/><rect x="44" y="102" width="94" height="33" rx="16" fill="#244744" stroke="none" stroke-width="2"/><text x="91" y="126" fill="#fffaf0" font-size="19" font-weight="600" text-anchor="middle">욥 28</text><path d="M208 372 V274 L128 202 M208 274 L284 202" fill="none" stroke="#244744" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><circle cx="128" cy="202" r="20" fill="#dce6d0" stroke="#6e8963" stroke-width="3"/><path d="M272 190 L296 214 M296 190 L272 214" fill="none" stroke="#b96c48" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="208" y="424" fill="#244744" font-size="27" font-weight="600" text-anchor="middle">경외 · 악을 떠남</text><text x="208" y="465" fill="#708073" font-size="20" font-weight="600" text-anchor="middle">28:28</text></g><g data-visual-part="1"><rect x="408" y="86" width="368" height="400" rx="18" fill="#f0e6cf" stroke="none" stroke-width="2"/><rect x="428" y="102" width="94" height="33" rx="16" fill="#244744" stroke="none" stroke-width="2"/><text x="475" y="126" fill="#fffaf0" font-size="19" font-weight="600" text-anchor="middle">잠언</text><g transform="translate(594 267) scale(1.5)"><path d="M0 46 V-13 M0 10 L-20 -9 M0 -1 L22 -22" fill="none" stroke="#6e8963" stroke-width="7"